name: Desplegar base de datos

# Aplica las migraciones nuevas a Supabase cuando cambian en main.
# Requiere estos secrets del repositorio (Settings → Secrets and variables → Actions):
#   SUPABASE_ACCESS_TOKEN  – supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   – el id del proyecto (Project Settings → General)
#   SUPABASE_DB_PASSWORD   – la contraseña de la base que definió al crear el proyecto

on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: desplegar-db
  cancel-in-progress: false

jobs:
  migrar:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Verificar secrets
        id: check
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "Faltan secrets de Supabase; se omite el despliegue." >> "$GITHUB_STEP_SUMMARY"
            echo "listo=false" >> "$GITHUB_OUTPUT"
          else
            echo "listo=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.listo == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.check.outputs.listo == 'true'
        with:
          version: latest
      - name: Vincular proyecto
        if: steps.check.outputs.listo == 'true'
        run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Aplicar migraciones
        if: steps.check.outputs.listo == 'true'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
